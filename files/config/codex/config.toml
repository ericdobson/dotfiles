NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1021.31345"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/eric/.config/codex/plugins/cache/openai-bundled/browser/26.1021.31345/scripts/browser-service.mjs"}'
